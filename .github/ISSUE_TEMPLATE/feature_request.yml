name: Feature request
description: Suggest a provider, an API or another improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `@hussmartinez/ai-core` is the family's only package with network code. It makes requests only to endpoints the host configures, and keeps keys on the server by default ([ADR 0035](https://github.com/ie-huss-martinez/sdk-core/blob/main/docs/adr/0035-ai-core-and-host-configured-network.md)). It renders nothing, so display features belong in the application or in an SDK that defines its own provider port. A new parameter of an existing provider can often be used already, through `providerOptions`.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, ideally with an example of the API you'd like to use. For a new provider, link its API documentation for authentication, streaming, errors and browser (CORS) support.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, such as an OpenAI-compatible endpoint or a custom provider, and why they fall short.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this hasn't been suggested yet.
          required: true
        - label: I checked that this doesn't contradict STANDARDS.md or an accepted ADR, or I explain why it should change.
          required: true
